<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otter 🦦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#08141a; --panel:#0d2029; --panel-2:#123039; --panel-line:#1e4d55;
  --amber:#2e8f8a; --amber-bright:#5fd3c4; --amber-dim:#1a5a58;
  --sage:#4f8f6a; --sage-dim:#264a38;
  --parchment:#dff0ec; --muted:#7ba3a6;
  --ember:#c1503a; --ember-bright:#e07a5f;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(46,143,138,0.18), transparent 45%),
    radial-gradient(circle at 85% 12%, rgba(38,74,56,0.20), transparent 45%),
    var(--ink);
  color:var(--parchment);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
h1,h2,h3{font-family:'Fraunces',serif; color:var(--amber-bright); margin:0 0 4px;}
h2{font-size:1.15rem;}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
#app{max-width:1280px;margin:0 auto;padding:28px 22px 80px;}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:16px;}
.eyebrow{font-size:.72rem;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;}
.subtitle{color:var(--muted);font-size:.9rem;max-width:420px;}
.header-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-right:46px;}
.badge{background:var(--panel-2);border:1px solid var(--panel-line);border-radius:999px;padding:6px 14px;font-size:.78rem;color:var(--amber-bright);}
.btn{border:1px solid var(--panel-line);background:var(--panel-2);color:var(--parchment);border-radius:10px;padding:8px 14px;font-size:.85rem;cursor:pointer;}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#08141a;font-weight:600;}
.btn.ghost{background:transparent;}
.btn.small{padding:5px 10px;font-size:.78rem;}
.file-label{display:inline-flex;align-items:center;cursor:pointer;}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.grid-top{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;}
@media (max-width:860px){ .grid-top{grid-template-columns:minmax(0,1fr);} }

.notices{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.notice{border-radius:10px;padding:8px 12px;font-size:.85rem;}
.notice.warning{background:#3a241d;color:var(--ember-bright);}
.notice.motivate{background:#233324;color:#bcd6a0;}
.notice.reminder{background:var(--panel-2);color:var(--parchment);}

.reminder-banner{background:var(--panel-2);border:1px solid var(--amber-dim);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.88rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.scene-zone{position:relative;height:220px;border-radius:12px;overflow:hidden;isolation:isolate;margin-bottom:14px;}
.scene-svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
.scene-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.scene-glow{position:absolute;inset:0;z-index:0;pointer-events:none;}
.scene-night-tint{position:absolute;inset:0;z-index:0;background:rgba(8,10,18,0.5);pointer-events:none;}
.phase-badge{position:absolute;bottom:6px;right:8px;z-index:2;font-size:.65rem;color:var(--parchment);background:rgba(0,0,0,0.4);padding:2px 9px;border-radius:999px;}
.tree-layer{position:absolute;bottom:0;z-index:0;pointer-events:none;opacity:0.92;}
.tree-layer svg{display:block;height:100%;width:auto;}
.tree-left{left:2%; width:56px; height:78%;}
.tree-right{right:2%; width:56px; height:78%;}
.tree-center{left:50%; width:74px; height:92%; transform:translateX(-50%); opacity:0.8;}
.fireflies{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#e4f27a;box-shadow:0 0 6px 2px rgba(228,242,122,0.85);opacity:0;animation:fireflyPulse 3.6s ease-in-out infinite;}
@keyframes fireflyPulse{
  0%,100%{opacity:0;transform:translate(0,0);}
  20%{opacity:1;}
  50%{opacity:.25;transform:translate(5px,-7px);}
  75%{opacity:.9;transform:translate(-4px,-2px);}
}
.creature-stage{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:1;}
.podest-svg{margin-top:-6px;}
.waiting-hint{color:var(--muted);font-size:.85rem;font-style:italic;margin:4px 0;}

.creature-name-input{background:transparent;border:none;border-bottom:1px dashed var(--panel-line);color:var(--amber-bright);font-family:'Fraunces',serif;font-size:1.05rem;padding:2px 0 6px;margin-bottom:10px;width:100%;max-width:260px;}
.creature-name-input:focus{outline:none;border-bottom-color:var(--amber);}
.creature-name-input::placeholder{color:var(--muted);font-family:'Inter',sans-serif;font-size:.85rem;font-style:italic;}
.gauge-row{display:flex;gap:16px;align-items:flex-start;}
.gauge-track{position:relative;width:40px;height:220px;background:var(--panel-2);border:1px solid var(--panel-line);border-radius:20px;overflow:hidden;flex-shrink:0;}
.gauge-fill{position:absolute;left:0;right:0;bottom:0;border-radius:20px;transition:height .5s ease;}
.gauge-mark{position:absolute;right:3px;width:10px;height:1px;background:rgba(0,0,0,.3);}
.gauge-info{flex:1;min-width:0;}
.level-name{font-weight:600;margin-bottom:4px;}
.feed-status{font-size:.8rem;color:var(--muted);margin:6px 0;}
.feed-status.at-risk{color:var(--ember-bright);}
.milestone-list{font-size:.68rem;color:var(--muted);line-height:1.6;margin-top:6px;}

.add-task-form .form-row{display:flex;flex-wrap:wrap;gap:8px;}
.add-task-form input[type=text], .add-task-form select, .add-task-form input[type=date]{
  background:var(--panel-2);border:1px solid var(--panel-line);color:var(--parchment);border-radius:8px;padding:8px 10px;font-size:.85rem;
}
.grow-input{flex:1 1 160px;min-width:140px;}
.new-label-form{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.new-label-form input[type=text], .new-label-form input[type=time]{background:var(--panel-2);border:1px solid var(--panel-line);color:var(--parchment);border-radius:8px;padding:6px 10px;}
.color-row{display:flex;gap:6px;}
.color-swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.color-swatch.selected{border-color:var(--parchment);}

.filter-tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;font-size:.82rem;}
.tab{border:1px solid var(--panel-line);background:transparent;color:var(--parchment);border-radius:999px;padding:5px 12px;cursor:pointer;}
.tab.active{background:var(--amber);border-color:var(--amber);color:#08141a;}
.cluster-toggle{margin-left:auto;color:var(--muted);font-size:.78rem;display:flex;align-items:center;gap:6px;}

.task-group{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.label-group-title{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px;}
.task-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--panel-line);border-radius:10px;}
.task-row.done{opacity:.5;}
.task-left{display:flex;align-items:center;gap:10px;flex:1 1 140px;min-width:140px;}
.task-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;}
.label-chip{font-size:.72rem;border-radius:999px;padding:2px 9px;}
.due-chip{font-size:.72rem;color:var(--muted);}
.due-chip.overdue{color:var(--ember-bright);}
.icon-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;}
.empty-hint{color:var(--muted);font-size:.85rem;font-style:italic;padding:6px 2px;}

.cal-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.cal-nav{display:flex;align-items:center;gap:10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px;}
.cal-weekday{text-align:center;font-size:.68rem;color:var(--muted);padding:4px 0;}
.cal-cell{background:var(--panel-2);border:1px solid var(--panel-line);border-radius:8px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--parchment);cursor:pointer;gap:2px;}
.cal-cell.empty{background:transparent;border:none;cursor:default;}
.cal-cell.today{border-color:var(--amber);}
.cal-cell.selected{background:var(--amber-dim);}
.cal-day{font-size:.78rem;}
.cal-dot{font-size:.6rem;background:var(--ember);color:#fff;border-radius:999px;padding:0 5px;}
.cal-marks{display:flex;align-items:center;gap:3px;min-height:12px;}
.cal-event-dot{width:5px;height:5px;border-radius:50%;background:var(--sage);display:inline-block;}
.day-events{margin-top:14px;padding-top:12px;border-top:1px solid var(--panel-line);}
.day-events-title{margin:0;font-size:.92rem;font-family:'Fraunces',serif;color:var(--amber-bright);}

.label-list{display:flex;flex-direction:column;gap:6px;}
.label-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:var(--panel-2);border:1px solid var(--panel-line);border-radius:10px;padding:8px 12px;}
.label-left{display:flex;align-items:center;gap:8px;}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;}

.sub-label{font-size:.78rem;color:var(--muted);margin:10px 0 6px;}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap;}
.swatch-btn{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch-btn.locked{opacity:.3;cursor:not-allowed;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip-btn{border:1px solid var(--panel-line);background:var(--panel-2);color:var(--parchment);border-radius:999px;padding:6px 12px;font-size:.8rem;cursor:pointer;}
.chip-btn.active{background:var(--amber);border-color:var(--amber);color:#08141a;}
.chip-btn:disabled{opacity:.35;cursor:not-allowed;}

.switch-row{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:8px;}
.hint-text{color:var(--muted);font-size:.8rem;margin-top:6px;}

.foot-note{color:var(--muted);font-size:.75rem;text-align:center;margin-top:20px;}

.eye-pupil{transition:transform .05s linear;}
.lion-svg{--face:1;will-change:transform;}
.lion-svg.mood-fainted{transition:transform .4s ease;transform:rotate(90deg) translateY(6px);}
.lion-ears{transform-box:fill-box;transform-origin:center;}
.lion-tail{transform-box:fill-box;transform-origin:left center;}
.lion-head{transform-box:fill-box;transform-origin:center bottom;}
.eye-pupil{transform-box:fill-box;transform-origin:center;}
@keyframes headTurn{0%,100%{transform:rotate(0);}30%{transform:rotate(-8deg);}65%{transform:rotate(6deg);}}
.anim-head-turn{animation:headTurn .6s ease;}
@keyframes eyeBlink{0%,100%{transform:scaleY(1);}45%,60%{transform:scaleY(.12);}}
.anim-blink{animation:eyeBlink .5s ease;}
.dust-puff{position:absolute;left:50%;bottom:-2px;width:46px;height:16px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle, rgba(230,215,180,.6), transparent 70%);animation:dustPuff .7s ease-out forwards;pointer-events:none;z-index:2;}
@keyframes dustPuff{0%{opacity:0;transform:scale(.4);}30%{opacity:.85;}100%{opacity:0;transform:scale(1.6) translateY(-4px);}}
.paw-sparkle{display:inline-block;margin-left:8px;animation:pawSparkle .9s ease-out forwards;}
@keyframes pawSparkle{0%{opacity:0;transform:translateY(4px) scale(.6);}30%{opacity:1;}100%{opacity:0;transform:translateY(-10px) scale(1.1);}}
@keyframes pawRaise{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-9px) rotate(-14deg)}70%{transform:translateY(-3px) rotate(-7deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes earWiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(9deg)}60%{transform:rotate(-7deg)}}
@keyframes tailFlick{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}55%{transform:rotate(14deg)}80%{transform:rotate(-6deg)}}
@keyframes bodyJump{0%{transform:translateX(var(--wx,0px)) translateY(0) scaleY(1) scaleX(var(--face,1))}15%{transform:translateX(var(--wx,0px)) translateY(2px) scaleY(.92) scaleX(var(--face,1))}45%{transform:translateX(var(--wx,0px)) translateY(-24px) scaleY(1.05) scaleX(var(--face,1))}70%{transform:translateX(var(--wx,0px)) translateY(0) scaleY(.94) scaleX(var(--face,1))}100%{transform:translateX(var(--wx,0px)) translateY(0) scaleY(1) scaleX(var(--face,1))}}
@keyframes reactGlow{0%{filter:brightness(1)}30%{filter:brightness(1.3) drop-shadow(0 0 10px var(--amber-bright))}100%{filter:brightness(1)}}
.anim-paw-raise{animation:pawRaise .7s ease;}
.anim-ear-wiggle{animation:earWiggle .7s ease;}
.anim-tail-flick{animation:tailFlick .7s ease;}
.anim-jump{animation:bodyJump .8s cubic-bezier(.3,.6,.3,1);}
.anim-glow{animation:reactGlow 1.2s ease;}
.prey-icon{display:inline-flex;align-items:center;flex-shrink:0;margin-right:2px;line-height:0;transition:opacity .25s ease,transform .25s ease;}
.task-row.done .prey-icon{opacity:.25;filter:grayscale(1);transform:scale(.85);}
.flying-prey{position:fixed;z-index:999;pointer-events:none;margin-left:-10px;margin-top:-7px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));}
@keyframes chomp{0%,100%{transform:scaleY(1) scaleX(1);}30%{transform:scaleY(.82) scaleX(1.1);}55%{transform:scaleY(1.08) scaleX(.95);}}
.anim-chomp{animation:chomp .45s cubic-bezier(.3,.7,.4,1);}
.chomp-drop{position:fixed;z-index:998;width:5px;height:5px;border-radius:50%;background:var(--amber-bright);opacity:0;pointer-events:none;animation:chompDrop .55s ease-out forwards;}
@keyframes chompDrop{0%{opacity:.9;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--ddx,0px),-26px) scale(.35);}}

.gear-btn{position:fixed;top:16px;right:16px;z-index:40;background:var(--panel-2);border:1px solid var(--panel-line);color:var(--parchment);border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
.settings-overlay{position:fixed;inset:0;background:rgba(10,7,4,0.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;}
.settings-modal{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius);max-width:640px;width:100%;padding:20px 22px 26px;}
.settings-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.settings-modal .panel{background:var(--panel-2);}
.lang-row{display:flex;gap:8px;margin:6px 0 4px;}
.event-color-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:2px;}
</style>

// ---------- Storage-Abstraktion (Web-Artefakt / Capacitor / localStorage) ----------
var loewenStorage = {
  get: function(key){
    return new Promise(function(resolve){
      try{
        if (window.storage && typeof window.storage.get === 'function'){
          window.storage.get(key, false).then(function(r){ resolve(r ? r.value : null); }).catch(function(){ resolve(null); });
          return;
        }
      }catch(e){}
      try{
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences){
          window.Capacitor.Plugins.Preferences.get({ key: key }).then(function(r){ resolve(r.value); }).catch(function(){ resolve(null); });
          return;
        }
      }catch(e){}
      try{ resolve(localStorage.getItem(key)); }catch(e){ resolve(null); }
    });
  },
  set: function(key, value){
    return new Promise(function(resolve){
      try{
        if (window.storage && typeof window.storage.set === 'function'){
          window.storage.set(key, value, false).then(function(){ resolve(); }).catch(function(){ resolve(); });
          return;
        }
      }catch(e){}
      try{
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences){
          window.Capacitor.Plugins.Preferences.set({ key: key, value: value }).then(function(){ resolve(); }).catch(function(){ resolve(); });
          return;
        }
      }catch(e){}
      try{ localStorage.setItem(key, value); }catch(e){}
      resolve();
    });
  }
};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n){

  return d.toISOString().slice(0,10);
}
function daysBetween(a, b){
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function fmtDate(dateStr){
  var d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(t('localeCode'), { day:'2-digit', month:'2-digit', year:'numeric' });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function migrateState(raw){
  raw = raw || {};
  var d = defaultState();
  var s = {};
  for (var k in d){ s[k] = (raw[k] !== undefined) ? raw[k] : d[k]; }
  s.labels = Array.isArray(raw.labels) && raw.labels.length ? raw.labels : d.labels;
  if (!s.labels.some(function(l){ return l.id==='unlabeled'; })){
    s.labels.unshift({ id:'unlabeled', name:'Ohne Label', color:'#8a7a63' });
  }
  s.tasks = Array.isArray(raw.tasks) ? raw.tasks.map(function(t){
    return Object.assign({ flaggedOverdue:false, doneDate:null, createdDate: todayStr() }, t);
  }) : [];
  s.customization = Object.assign({}, d.customization, raw.customization || {});
  s.reminder = Object.assign({}, d.reminder, raw.reminder || {});
  s.calendarView = Object.assign({}, d.calendarView, raw.calendarView || {});
  s.growthLog = Array.isArray(raw.growthLog) ? raw.growthLog : [];
  s.milestones = Array.isArray(raw.milestones) ? raw.milestones : [];
  s.notices = Array.isArray(raw.notices) ? raw.notices : [];
  s.events = Array.isArray(raw.events) ? raw.events.map(function(e){
    return Object.assign({ reminderEnabled:true, time:null, color:null }, e);
  }) : [];
  if (typeof s.growth !== 'number') s.growth = 0;
  if (typeof s.maxGrowthEver !== 'number') s.maxGrowthEver = s.growth;
  if (typeof s.totalCompleted !== 'number') s.totalCompleted = 0;
  if (!s.lastActivityDate) s.lastActivityDate = todayStr();
  if (s.language !== 'en' && s.language !== 'de') s.language = 'de';
  if (typeof s.creatureName !== 'string') s.creatureName = '';
  return s;
}

// ---------- Kernlogik: Wachstum & Fütterung ----------
function logGrowth(){
  var t = todayStr();
  var last = state.growthLog[state.growthLog.length-1];
  if (last && last.date===t) last.growth = state.growth;
  else state.growthLog.push({ date:t, growth: state.growth });
  if (state.growthLog.length > 200) state.growthLog.shift();
}
function checkMilestones(){
  LEVELS.forEach(function(lvl, idx){
    if (state.maxGrowthEver >= lvl.min && !state.milestones.some(function(m){ return m.idx===idx; })){
      state.milestones.push({ idx: idx, date: todayStr() });
    }
  });
}
function applyGrowth(delta){
  state.growth = Math.max(0, Math.min(100, state.growth + delta));
  if (state.growth > state.maxGrowthEver) state.maxGrowthEver = state.growth;
  logGrowth();
  checkMilestones();
}
function setCreatureName(name){
  state.creatureName = (name || '').trim().slice(0, 24);
  saveAndRender();
}
function pushNotice(type, text){
  state.notices = state.notices || [];
  state.notices.unshift({ id:'n'+Date.now()+Math.random().toString(36).slice(2,5), type:type, text:text });
  state.notices = state.notices.slice(0,6);
}
function notifyBrowser(title, body){
  if (('Notification' in window) && Notification.permission === 'granted'){
    try{ new Notification(title, { body: body }); }catch(e){}

  if (ln){

  }
}
// ---------- Native Android Push (Capacitor LocalNotifications) ----------
// Läuft nur, wenn die App als Capacitor-App gebaut wurde - im normalen Browser
// ist capNotif() immer null und der Rest bleibt folgenlos.
function capNotif(){
  try{
    return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) ? window.Capacitor.Plugins.LocalNotifications : null;
  }catch(e){ return null; }
}
function hashId(str, base){
  var h = 0;
  for (var i=0;i<str.length;i++){ h = ((h<<5)-h+str.charCodeAt(i))|0; }
  return Math.abs(h % 500000) + (base || 2000); // 0/1 sind für Tages-/Vernachlässigungs-Erinnerung reserviert
}
function scheduleTaskNotification(task){
  var ln = capNotif();
  if (!ln || task.done) return;
  var due = new Date(task.due + 'T09:00:00');
  if (due.getTime() <= Date.now()) return;
  try{
    ln.schedule({ notifications: [{
      id: hashId(task.id),
      title: t('notifTaskDueTitle'),
      body: t('notifTaskDueBody', { text: task.text }),
      schedule: { at: due }
    }]});
  }catch(e){}
}
function cancelTaskNotification(task){
  var ln = capNotif();
  if (!ln) return;
  try{ ln.cancel({ notifications: [{ id: hashId(task.id) }] }); }catch(e){}
}
function scheduleEventNotification(ev){
  var ln = capNotif();
  if (!ln || !ev.reminderEnabled) return;
  var at = new Date(ev.date + 'T' + (ev.time || '09:00') + ':00');
  if (at.getTime() <= Date.now()) return;
  try{
    ln.schedule({ notifications: [{
      id: hashId(ev.id, 700000),
      title: t('notifEventTitle', { title: ev.title }),
      body: fmtDate(ev.date) + (ev.time ? t('notifEventBodyTime', { t: ev.time }) : ''),
      schedule: { at: at }
    }]});
  }catch(e){}
}
function cancelEventNotification(ev){
  var ln = capNotif();
  if (!ln) return;
  try{ ln.cancel({ notifications: [{ id: hashId(ev.id, 700000) }] }); }catch(e){}
}
function rescheduleNeglectNotification(){
  var ln = capNotif();
  if (!ln) return;
  try{ ln.cancel({ notifications: [{ id: 2 }] }); }catch(e){}
  if (!state.reminder.warnings) return;
  var at = new Date(new Date(state.lastActivityDate + 'T00:00:00').getTime() + NEGLECT_DAYS*86400000 + 9*3600000);
  if (at.getTime() > Date.now()){
    try{
      ln.schedule({ notifications: [{
        id: 2,
        title: t('notifNeglectTitle'),
        body: t('noticeNeglect', { n: NEGLECT_DAYS }),
        schedule: { at: at }
      }]});
    }catch(e){}
  }
}
function rescheduleDailyReminder(){
  var ln = capNotif();
  if (!ln) return;
  try{ ln.cancel({ notifications: [{ id: 1 }] }); }catch(e){}
  if (!state.reminder.enabled) return;
  var parts = state.reminder.time.split(':');
  try{
    ln.schedule({ notifications: [{
      id: 1,
      title: t('notifDailyTitle'),
      body: t('notifDailyBody'),
      schedule: { on: { hour: parseInt(parts[0],10), minute: parseInt(parts[1],10) }, allowWhileIdle: true }
    }]});
  }catch(e){}
}
function pickMotivation(){
  var lines = t('motivations');
  return lines[Math.floor(Math.random()*lines.length)];
}
function checkFeedingStatus(){
  var today = todayStr();
  var penalty = 0;
  var overdueFired = false;
  state.tasks.forEach(function(task){
    if (!task.done && !task.flaggedOverdue && task.due < today){
      task.flaggedOverdue = true;
      penalty += OVERDUE_PENALTY;
      overdueFired = true;
    }
  });
  var gap = daysBetween(state.lastActivityDate, today);
  var neglected = false;
  if (gap >= NEGLECT_DAYS && state.lastNeglectPenaltyDate !== today){
    penalty += NEGLECT_PENALTY;
    neglected = true;
    state.lastNeglectPenaltyDate = today;
  }
  if (penalty > 0){
    applyGrowth(-penalty);
    if (overdueFired){
      pushNotice('warning', t('noticeOverdue'));
      if (state.reminder.warnings) notifyBrowser(t('notifOverdueTitle'), t('notifOverdueBody'));
    }
    if (neglected){
      pushNotice('warning', t('noticeNeglect', { n: gap }));
      if (state.reminder.warnings) notifyBrowser(t('notifNeglectTitle'), t('notifNeglectBody'));
    }
    return true;
  }
  return false;
}

// ---------- Aktionen ----------
function completeTask(id){
  var task = state.tasks.filter(function(x){ return x.id===id; })[0];
  if (!task || task.done) return;
  var preyFrom = preyRectFor(id);
  var preyType = preyTypeFor(id);
  task.done = true;
  task.doneDate = todayStr();
  state.lastActivityDate = todayStr();
  state.totalCompleted = (state.totalCompleted || 0) + 1;
  if (!state.firstTaskDate) state.firstTaskDate = todayStr();
  applyGrowth(GROWTH_PER_TASK);
  var msg = pickMotivation();
  pushNotice('motivate', msg);
  if (state.reminder.motivational) notifyBrowser(t('notifFedTitle'), msg);
  cancelTaskNotification(task);
  rescheduleNeglectNotification();
  saveAndRender();
  flyPrey(preyType, preyFrom);
}

  var t = state.tasks.filter(function(x){ return x.id===id; })[0];
  if (t) cancelTaskNotification(t);
  state.tasks = state.tasks.filter(function(t){ return t.id !== id; });

function addTaskFromForm(){
  var textEl = document.getElementById('newTaskText');
  var dueSel = document.getElementById('newTaskDue');
  var dueDateEl = document.getElementById('newTaskDueDate');
  var text = textEl ? textEl.value.trim() : '';
  if (!text) return;
  var due;
  if (!dueSel || dueSel.value === 'today') due = todayStr();
  else if (dueSel.value === 'tomorrow') due = addDays(todayStr(), 1);
  else due = (dueDateEl && dueDateEl.value) ? dueDateEl.value : todayStr();
  var labelId = ui.selectedLabelId || state.labels[0].id;
  var newTask = {
    id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    text: text, labelId: labelId, due: due, done:false, doneDate:null,
    flaggedOverdue:false, createdDate: todayStr()
  };
  state.tasks.push(newTask);
  state.lastActivityDate = todayStr();
  scheduleTaskNotification(newTask);
  rescheduleNeglectNotification();
  saveAndRender();
}

function setPhoto(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxDim = 500, w = img.width, h = img.height;
      if (w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if (h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.customPhoto = canvas.toDataURL('image/jpeg', 0.72);
      saveAndRender();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'maehne-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var imported;
    try{ imported = JSON.parse(e.target.result); }catch(err){ alert(t('alertInvalidJson')); return; }
    if (!imported || !Array.isArray(imported.tasks) || !Array.isArray(imported.labels)){
      alert(t('alertInvalidBackup'));
      return;
    }
    state = migrateState(imported);
    ui.selectedLabelId = (state.labels.filter(function(l){ return l.id!=='unlabeled'; })[0] || state.labels[0]).id;
    checkFeedingStatus();
    saveAndRender();
  };
  reader.readAsText(file);
}

// ---------- Reaktions-Animation ----------
function flash(el, cls, ms){
  if (!el) return;
  el.classList.add(cls);
  setTimeout(function(){ el.classList.remove(cls); }, ms);
}
function triggerReaction(){
  var svgEl = document.querySelector('.lion-svg');
  if (!svgEl) return;
  var idx = LEVELS.indexOf(levelForGrowth(state.growth));
  var tier = Math.min(3, Math.floor(idx/2));
  if (tier === 0){
    flash(svgEl.querySelector('.lion-paws-front'), 'anim-paw-raise', 700);
  } else if (tier === 1){
    flash(svgEl.querySelector('.lion-ears'), 'anim-ear-wiggle', 700);
    flash(svgEl.querySelector('.lion-tail'), 'anim-tail-flick', 700);
  } else if (tier === 2){
    flash(svgEl, 'anim-jump', 800);
  } else {
    flash(svgEl, 'anim-jump', 800);
    flash(svgEl, 'anim-glow', 1200);
  }
}
function spawnDustPuff(){
  var stage = document.querySelector('.creature-stage');
  if (!stage) return;
  var puff = document.createElement('div');
  puff.className = 'dust-puff';
  stage.appendChild(puff);
  setTimeout(function(){ puff.remove(); }, 700);
}
function spawnPawSparkle(){
  var heading = document.querySelector('.aufgaben-panel h2');
  if (!heading) return;
  var el = document.createElement('span');
  el.className = 'paw-sparkle';
  el.textContent = '🐾';
  heading.appendChild(el);
  setTimeout(function(){ el.remove(); }, 900);
}
function triggerExtraEffect(){
  var key = state.customization.extraReaction || 'none';
  var def = EXTRA_REACTIONS[key];
  if (!def || key === 'none' || state.maxGrowthEver < def.unlock) return;
  if (key === 'blink'){
    document.querySelectorAll('.eye-pupil').forEach(function(el){ flash(el, 'anim-blink', 500); });
  } else if (key === 'headturn'){
    flash(document.querySelector('.lion-head'), 'anim-head-turn', 600);
  } else if (key === 'dust'){
    spawnDustPuff();
  } else if (key === 'sparkle'){
    spawnPawSparkle();
  }
}

function waitForScrollEnd(cb){
  var last = window.scrollY, still = 0, tries = 0;
  var iv = setInterval(function(){
    tries++;
    if (Math.abs(window.scrollY - last) < 1){ still++; } else { still = 0; }
    last = window.scrollY;
    if (still >= 3 || tries > 60){ clearInterval(iv); cb(); }
  }, 50);
}
function flyPrey(type, from){
  var svg = document.querySelector('.lion-svg');
  var zone = document.querySelector('.scene-zone');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!svg || !from || reduced){ chompBite(); return; }

  var el = document.createElement('div');
  el.className = 'flying-prey';
  el.innerHTML = preySVG(type);
  el.style.left = from.x + 'px';
  el.style.top = from.y + 'px';
  document.body.appendChild(el);

  // Phase 1: Beute wandert in die Bildschirmmitte und bleibt dort liegen
  var cx = window.innerWidth / 2;
  var cy = window.innerHeight / 2;
  var toCenter = 'translate(' + (cx - from.x) + 'px,' + (cy - from.y) + 'px) scale(2.1) rotate(-8deg)';
  var a1 = el.animate([
    { transform:'translate(0px,0px) scale(1) rotate(0deg)' },
    { transform:toCenter }
  ], { duration:520, easing:'cubic-bezier(.25,.8,.35,1)', fill:'forwards' });

  // Gleichzeitig die Seite zum Otter hochscrollen
  if (zone && zone.scrollIntoView){
    try { zone.scrollIntoView({ behavior:'smooth', block:'center' }); }
    catch(err){ zone.scrollIntoView(); }
  }

  a1.onfinish = function(){
    waitForScrollEnd(function(){
      // Phase 2: erst jetzt, wenn der Otter sichtbar ist, den Bogen zur Schnauze
      var target = document.querySelector('.lion-svg');
      if (!target){ el.remove(); chompBite(); return; }
      var r = target.getBoundingClientRect();
      var toX = r.left + r.width/2;
      var toY = r.top + r.height * 0.56;
      var dx = toX - from.x, dy = toY - from.y;
      var mx = cx - from.x, my = cy - from.y;
      var arc = -Math.max(42, Math.abs(toX - cx) * 0.4);

      var a2 = el.animate([
        { transform:toCenter },
        { transform:'translate(' + ((mx+dx)/2) + 'px,' + ((my+dy)/2 + arc) + 'px) scale(1.7) rotate(-16deg)', offset:0.55 },
        { transform:'translate(' + dx + 'px,' + dy + 'px) scale(0.55) rotate(12deg)', opacity:0.9 }
      ], { duration:900, easing:'cubic-bezier(.4,.05,.6,1)', fill:'forwards' });

      a2.onfinish = function(){
        el.remove();
        chompBite();
      };
    });
  };
}
function chompBite(){
  var head = document.querySelector('.lion-head');
  flash(head, 'anim-chomp', 500);
  var svg = document.querySelector('.lion-svg');
  if (!svg) return;
  var r = svg.getBoundingClientRect();
  for (var i=0;i<5;i++){
    (function(i){
      var d = document.createElement('div');
      d.className = 'chomp-drop';
      d.style.left = (r.left + r.width/2 + (Math.random()*26-13)) + 'px';
      d.style.top  = (r.top + r.height*0.56) + 'px';
      d.style.setProperty('--ddx', (Math.random()*44-22).toFixed(0) + 'px');
      d.style.animationDelay = (i*30) + 'ms';
      document.body.appendChild(d);
      setTimeout(function(){ d.remove(); }, 700 + i*30);
    })(i);
  }
  setTimeout(function(){
    triggerReaction();
    triggerExtraEffect();
  }, 260);
}
function preyRectFor(id){

function eyeParallax(e){
  var svg = document.querySelector('.lion-svg');
  if (!svg) return;
  var rect = svg.getBoundingClientRect();
  var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;

}

// ---------- Umherstreifen am Ufer ----------
var wander = { x:0, target:0, face:1, walking:false, pauseUntil:0, raf:null, last:0 };

function wanderRange(){
  var zone = document.querySelector('.scene-zone');
  var w = zone ? zone.clientWidth : 300;
  var r = Math.max(20, Math.min(90, w * 0.26));
  // Auf einem Felsen bleibt er in der Nähe seines Liegeplatzes
  if ((state.customization.podest || 'none') !== 'none') r = Math.min(r, 14);
  return r;
}
function pickWanderTarget(){
  var r = wanderRange();
  var next = wander.x, tries = 0;
  do {
    next = (Math.random() * 2 - 1) * r;
    tries++;
  } while (Math.abs(next - wander.x) < r * 0.35 && tries < 12);
  wander.target = next;
  wander.face = (next < wander.x) ? -1 : 1;
  wander.walking = true;
}
function wanderStep(ts){
  wander.raf = requestAnimationFrame(wanderStep);
  var svg = document.querySelector('.lion-svg');
  if (!svg) return;
  // Ohnmächtig oder auf dem Felsen sitzend: kein Umherlaufen
  if (svg.classList.contains('mood-fainted')){
    svg.style.transform = '';
    wander.walking = false;
    return;
  }
  var dt = wander.last ? Math.min(0.05, (ts - wander.last) / 1000) : 0;
  wander.last = ts;

  var bobY = 0, tilt = 0;
  if (wander.walking){
    var speed = svg.classList.contains('mood-sad') ? 16 : 26; // px/s
    var dir = (wander.target > wander.x) ? 1 : -1;
    wander.x += dir * speed * dt;
    if ((dir > 0 && wander.x >= wander.target) || (dir < 0 && wander.x <= wander.target)){
      wander.x = wander.target;
      wander.walking = false;
      wander.pauseUntil = ts + 2200 + Math.random() * 5000;
    }
    var phase = ts / 1000 * 7.5;
    bobY = -Math.abs(Math.sin(phase)) * 2.2;
    tilt = Math.sin(phase) * 2.2;
  } else if (ts >= wander.pauseUntil){
    pickWanderTarget();
  } else {
    // ruhiges Atmen im Stehen
    bobY = Math.sin(ts / 1000 * 1.6) * 0.8;
  }
  svg.style.setProperty('--wx', wander.x.toFixed(1) + 'px');
  svg.style.setProperty('--face', wander.face);
  svg.style.transform = 'translate(' + wander.x.toFixed(1) + 'px,' + bobY.toFixed(2) + 'px) rotate(' + tilt.toFixed(2) + 'deg) scaleX(' + wander.face + ')';
}
function startWander(){
  if (wander.raf) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  wander.pauseUntil = performance.now() + 1200;
  wander.last = 0;
  wander.raf = requestAnimationFrame(wanderStep);
}

function renderLionSVG(stageIdx, maneStage){
  var pal = PALETTES[state.customization.palette] || PALETTES.savanna;
  var patchColor = state.customization.maneColor || pal.belly;
  var tailDef = TAIL_STYLES[state.customization.tailStyle] || TAIL_STYLES.classic;
  var scale = 0.5 + LEVELS[stageIdx].size * 0.6;

  var gapDays = daysBetween(state.lastActivityDate, todayStr());
  var mood = gapDays >= DRAMATIC_NEGLECT_DAYS ? 'fainted' : (gapDays >= NEGLECT_DAYS ? 'sad' : 'happy');

  var mouthPath = (mood === 'happy')
    ? '<path d="M94 121 Q100 126 106 121" stroke="' + pal.bodyDark + '" stroke-width="1.8" fill="none" stroke-linecap="round"/>'
    : '<path d="M94 125 Q100 120 106 125" stroke="' + pal.bodyDark + '" stroke-width="1.8" fill="none" stroke-linecap="round"/>';

  var eyesHtml = (mood === 'fainted')
    ? '<g class="eye-pupil"><path d="M85 100 L91 106 M91 100 L85 106" stroke="#0a1416" stroke-width="2.2" stroke-linecap="round"/></g>' +
      '<g class="eye-pupil"><path d="M109 100 L115 106 M115 100 L109 106" stroke="#0a1416" stroke-width="2.2" stroke-linecap="round"/></g>'
    : '<g class="eye-pupil"><ellipse cx="88" cy="103" rx="4" ry="4.2" fill="#0a1416"/><circle cx="89.4" cy="101.4" r="1.2" fill="#fff" opacity="0.9"/></g>' +
      '<g class="eye-pupil"><ellipse cx="112" cy="103" rx="4" ry="4.2" fill="#0a1416"/><circle cx="113.4" cy="101.4" r="1.2" fill="#fff" opacity="0.9"/></g>';

  var whiskers = '<g stroke="' + patchColor + '" stroke-width="0.9" opacity="0.5" stroke-linecap="round" fill="none">' +
    '<path d="M91 116 Q80 112 70 110"/><path d="M91 118 Q79 117 68 117"/><path d="M91 120 Q80 122 71 126"/>' +
    '<path d="M109 116 Q120 112 130 110"/><path d="M109 118 Q121 117 132 117"/><path d="M109 120 Q120 122 129 126"/>' +
  '</g>';

  // Kehlfleck & Brustzeichnung wachsen mit
  var patch = '';
  if (maneStage >= 1){
    patch += '<path d="M100 128 Q109 130 110 140 Q106 148 100 149 Q94 148 90 140 Q91 130 100 128 Z" fill="' + patchColor + '" opacity="0.9"/>';
  }
  if (maneStage >= 2){
    patch += '<ellipse cx="100" cy="158" rx="21" ry="12" fill="' + patchColor + '" opacity="0.55"/>';
  }

function renderSceneBackground(){
  var phase = scenePhase();
  var bg;
  if (state.customPhoto){

      '<div class="scene-glow" style="background:radial-gradient(circle at 50% 75%, rgba(95,211,196,' + (0.05+glow*0.35) + '), transparent 60%);"></div>';

    bg = renderSceneSVG(phase);

function visibleTaskGroups(){
  var t = todayStr();
  var tm = addDays(t,1);
  var list = state.tasks.filter(function(x){ return !x.done; });
  if (state.filter==='today') list = list.filter(function(x){ return x.due===t; });
  else if (state.filter==='tomorrow') list = list.filter(function(x){ return x.due===tm; });
  else if (state.filter==='date' && state.selectedDate) list = list.filter(function(x){ return x.due===state.selectedDate; });
  else if (state.filter==='week'){ var wEnd = addDays(t,7); list = list.filter(function(x){ return x.due>=t && x.due<=wEnd; }); }
  list.sort(function(a,b){ return a.due<b.due ? -1 : (a.due>b.due ? 1 : 0); });
  if (!state.clusterByLabel) return { all: list };
  var groups = {};
  list.forEach(function(t2){ (groups[t2.labelId] = groups[t2.labelId] || []).push(t2); });
  return groups;
}

    var dateStr = cal.year + '-' + String(cal.month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');

    var dayEvents = state.events.filter(function(e){ return e.date===dateStr; });
    var isToday = dateStr===todayStr();

    var eventDots = dayEvents.slice(0,3).map(function(e){
      return '<span class="cal-event-dot" style="background:' + (e.color || 'var(--sage)') + '"></span>';

    '<div class="cal-header">' +
      '<h3 class="day-events-title">' + t('eventsOnDay', { d: fmtDate(d) }) + '</h3>' +
      '<button class="btn ghost small" onclick="App.toggleEventForm()">' + (ui.showEventForm ? t('cancelBtn') : t('addEventBtn')) + '</button>' +
    '</div>' +
    list + form +
  '</div>';
}
function renderUpcomingEventsPanel(){
  var t = todayStr();
  var upcoming = state.events.filter(function(e){ return e.date >= t; }).slice().sort(function(a,b){
    var da = a.date + (a.time || '00:00'), db = b.date + (b.time || '00:00');
    return da < db ? -1 : (da > db ? 1 : 0);
  });
  var body = upcoming.length ? upcoming.map(function(e){
    return '<div class="task-row">' +
      '<div class="task-left"><span class="task-text">' + escapeHtml(e.title) + '</span></div>' +
      '<div class="task-right">' +
        '<span class="due-chip mono">' + fmtDate(e.date) + (e.time ? (', ' + e.time) : '') + '</span>' +
        '<button class="icon-btn" title="Erinnerung umschalten" onclick="App.toggleEventReminder(\'' + e.id + '\')">' + (e.reminderEnabled ? '🔔' : '🔕') + '</button>' +
        '<button class="icon-btn" title="Löschen" onclick="App.deleteEvent(\'' + e.id + '\')">✕</button>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="empty-hint">Keine anstehenden Termine.</div>';
  return '<section class="panel events-panel"><h2>Anstehende Ereignisse</h2><div class="task-list">' + body + '</div></section>';
}
function renderHistoryPanel(){
  var completed = state.tasks.filter(function(x){ return x.done; }).slice().sort(function(a,b){
    var da = a.doneDate || a.due, db = b.doneDate || b.due;
    return da < db ? 1 : (da > db ? -1 : 0);
  });
  var toggleLabel = ui.historyExpanded ? t('historyHide') : t('historyShow', { n: completed.length });
  var body = '';
  if (ui.historyExpanded){
    body = completed.length ? completed.map(function(task){
      var l = labelById(task.labelId);
      return '<div class="task-row done">' +
        '<div class="task-left"><span class="task-text">' + escapeHtml(task.text) + '</span></div>' +
        '<div class="task-right">' +
          '<span class="label-chip" style="background:' + l.color + '22;color:' + l.color + '">' + escapeHtml(labelDisplayName(l)) + '</span>' +
          '<span class="due-chip mono">' + t('doneOn', { d: fmtDate(task.doneDate || task.due) }) + '</span>' +
          '<button class="icon-btn" title="' + t('deleteBtn') + '" onclick="App.deleteTask(\'' + task.id + '\')">✕</button>' +
        '</div>' +
      '</div>';
    }).join('') : '<div class="empty-hint">' + t('emptyHistory') + '</div>';
  }
  return '<section class="panel history-panel">' +
    '<div class="cal-header"><h2>' + t('historyTitle') + '</h2>' +
      '<button class="btn ghost small" onclick="App.toggleHistory()">' + toggleLabel + '</button>' +
    '</div>' +
    body +
  '</section>';
}
function renderLabelPanel(){
  var toggleLabel = ui.labelsExpanded ? t('cancelBtn') : t('manageLabelsBtn');
  var body;
  if (ui.labelsExpanded){
    var rows = state.labels.map(function(l){
      var actions = (l.id !== 'unlabeled')
        ? ('<button class="icon-btn" title="' + t('renameTitle') + '" onclick="App.renameLabel(\'' + l.id + '\')">✎</button><button class="icon-btn" title="' + t('deleteBtn') + '" onclick="App.deleteLabel(\'' + l.id + '\')">✕</button>')
        : '<span class="mono" style="color:var(--muted)">' + t('labelDefault') + '</span>';
      return '<div class="label-row"><div class="label-left"><span class="dot" style="background:' + l.color + '"></span><span>' + escapeHtml(labelDisplayName(l)) + '</span></div><div class="label-right">' + actions + '</div></div>';
    }).join('');
    var colorSwatches = LABEL_COLORS.map(function(c){
      return '<button type="button" class="color-swatch ' + (ui.pendingLabelColor===c?'selected':'') + '" style="background:' + c + '" onclick="App.pickLabelColor(\'' + c + '\', this)"></button>';
    }).join('');
    body = '<div class="label-list">' + rows + '</div>' +
      '<div class="new-label-form" style="margin-top:10px;">' +
        '<input id="newLabelNameStandalone" type="text" placeholder="' + t('labelNamePlaceholder') + '">' +
        '<div class="color-row">' + colorSwatches + '</div>' +
        '<button class="btn small" onclick="App.saveNewLabelStandalone()">' + t('saveLabelBtn') + '</button>' +
      '</div>';
  } else {
    body = '<div class="chip-row">' + state.labels.map(function(l){
      return '<span class="label-chip" style="background:' + l.color + '22;color:' + l.color + '">' + escapeHtml(labelDisplayName(l)) + '</span>';
    }).join('') + '</div>';
  }
  return '<section class="panel label-panel">' +
    '<div class="cal-header"><h2>' + t('labelsTitle') + '</h2>' +
      '<button class="btn ghost small" onclick="App.toggleLabelsPanel()">' + toggleLabel + '</button>' +
    '</div>' +
    body +
  '</section>';
}
function renderAnpassungPanel(){
  var palettesHtml = Object.keys(PALETTES).map(function(key){
    var p = PALETTES[key];
    var locked = state.maxGrowthEver < p.unlock;
    var active = state.customization.palette===key;
    var outline = active ? 'outline:2px solid var(--parchment);outline-offset:2px;' : '';
    var label = t('pal_' + key) + (locked ? t('lockedSuffix', { n: p.unlock }) : '');
    return '<button class="swatch-btn ' + (locked?'locked':'') + '" ' + (locked?'disabled':'') + ' title="' + label + '" style="background:' + p.body + ';' + outline + '" onclick="App.setPalette(\'' + key + '\')"></button>';
  }).join('');
  var podesteHtml = Object.keys(PODESTE).map(function(key){
    var p = PODESTE[key];
    var locked = state.maxGrowthEver < p.unlock;
    var active = state.customization.podest===key;
    return '<button class="chip-btn ' + (active?'active':'') + '" ' + (locked?'disabled':'') + ' onclick="App.setPodest(\'' + key + '\')">' + t('podest_' + key) + (locked ? t('lockedSuffix', { n: p.unlock }) : '') + '</button>';
  }).join('');
  var maneUnlocked = state.maxGrowthEver >= MANE_UNLOCK_GROWTH;
  var maneHtml;
  if (!maneUnlocked){
    maneHtml = '<div class="hint-text">' + t('maneLockedHint', { n: MANE_UNLOCK_GROWTH }) + '</div>';
  } else {
    maneHtml = '<div class="swatch-row">' + MANE_COLORS.map(function(c){
      var active = (state.customization.maneColor || MANE_COLORS[0]) === c;
      var outline = active ? 'outline:2px solid var(--parchment);outline-offset:2px;' : '';
      return '<button class="swatch-btn" style="background:' + c + ';' + outline + '" onclick="App.setManeColor(\'' + c + '\')"></button>';
    }).join('') + '</div>';
  }
  return '<section class="panel anpassung-panel">' +
    '<h2>' + t('anpassungTitle') + '</h2>' +
    '<div class="sub-label">' + t('nameSub') + '</div>' +
    '<input type="text" class="creature-name-input" maxlength="24" placeholder="' + t('namePlaceholder') + '" value="' + escapeHtml(state.creatureName || '') + '" onchange="App.setCreatureName(this.value)">' +
    '<div class="sub-label">' + t('coatSub') + '</div>' +
    '<div class="swatch-row">' + palettesHtml + '</div>' +
    '<div class="sub-label">' + t('maneSub') + '</div>' +
    maneHtml +
    '<div class="sub-label">' + t('podestSub') + '</div>' +
    '<div class="chip-row">' + podesteHtml + '</div>' +
    '<div class="sub-label">' + t('tailSub') + '</div>' +
    '<div class="chip-row">' + Object.keys(TAIL_STYLES).map(function(key){
      var s = TAIL_STYLES[key];
      var locked = state.maxGrowthEver < s.unlock;
      var active = (state.customization.tailStyle || 'classic') === key;
      return '<button class="chip-btn ' + (active?'active':'') + '" ' + (locked?'disabled':'') + ' onclick="App.setTailStyle(\'' + key + '\')">' + t('tail_' + key) + (locked ? t('lockedSuffix', { n: s.unlock }) : '') + '</button>';
    }).join('') + '</div>' +
    '<div class="sub-label">' + t('reactionSub') + '</div>' +
    '<div class="chip-row">' + Object.keys(EXTRA_REACTIONS).map(function(key){
      var e = EXTRA_REACTIONS[key];
      var locked = state.maxGrowthEver < e.unlock;
      var active = (state.customization.extraReaction || 'none') === key;
      return '<button class="chip-btn ' + (active?'active':'') + '" ' + (locked?'disabled':'') + ' onclick="App.setExtraReaction(\'' + key + '\')">' + t('reaction_' + key) + (locked ? t('lockedSuffix', { n: e.unlock }) : '') + '</button>';
    }).join('') + '</div>' +
    '<div class="sub-label">' + t('treeSub', { n: TREE_UNLOCK_COMPLETED }) + '</div>' +
    '<div class="chip-row">' + Object.keys(TREE_POSITIONS).map(function(key){
      var locked = (state.totalCompleted || 0) < TREE_UNLOCK_COMPLETED;
      var active = (state.customization.treePosition || 'off') === key;
      return '<button class="chip-btn ' + (active?'active':'') + '" ' + (locked?'disabled':'') + ' onclick="App.setTreePosition(\'' + key + '\')">' + t('tree_' + key) + '</button>';
    }).join('') + (((state.totalCompleted || 0) < TREE_UNLOCK_COMPLETED) ? ('<div class="hint-text">🔒 ' + t('treeLockedHint', { n: TREE_UNLOCK_COMPLETED, c: (state.totalCompleted||0) }) + '</div>') : '') + '</div>' +
  '</section>';
}
function renderErinnerungPanel(){
  var r = state.reminder;
  var supported = ('Notification' in window);
  var permission = supported ? Notification.permission : 'unsupported';
  return '<section class="panel erinnerung-panel">' +
    '<h2>' + t('erinnerungenTitle') + '</h2>' +
    '<label class="switch-row"><input type="checkbox" ' + (r.enabled?'checked':'') + ' onchange="App.toggleReminderEnabled(this.checked)"> ' + t('dailyReminderLabel') + ' <input type="time" value="' + r.time + '" onchange="App.setReminderTime(this.value)" style="margin-left:6px"></label>' +
    '<label class="switch-row"><input type="checkbox" ' + (r.warnings?'checked':'') + ' onchange="App.toggleWarnings(this.checked)"> ' + t('warningsLabel') + '</label>' +
    '<label class="switch-row"><input type="checkbox" ' + (r.motivational?'checked':'') + ' onchange="App.toggleMotivational(this.checked)"> ' + t('motivationalLabel') + '</label>' +
    '<button class="btn ghost" onclick="App.requestNotifPermission()">' + t('allowNotifBtn') + (permission==='granted'?' ✓':'') + '</button>' +
    '<p class="hint-text">' + t('erinnerungenHint') + '</p>' +
    '<div class="sub-label">' + t('languageSub') + '</div>' +
    '<div class="lang-row">' +
      '<button class="chip-btn ' + (state.language==='de'?'active':'') + '" onclick="App.setLanguage(\'de\')">Deutsch</button>' +
      '<button class="chip-btn ' + (state.language==='en'?'active':'') + '" onclick="App.setLanguage(\'en\')">English</button>' +
    '</div>' +
  '</section>';
}
function renderFooter(){
  return '<footer class="foot-note">' + t('footNote') + '</footer>';
}
function buildAppHtml(){
  return '<div class="app-inner">' +
    safeRun(renderHeader) +
    safeRun(renderNotices) +
    safeRun(renderReminderBanner) +
    '<div class="grid-top">' + safeRun(renderSavanne) + safeRun(renderAufgabenPanel) + '</div>' +
    safeRun(renderLabelPanel) +
    safeRun(renderKalenderPanel) +
    safeRun(renderUpcomingEventsPanel) +
    safeRun(renderHistoryPanel) +
    safeRun(renderFooter) +
    (ui.settingsOpen ? safeRun(renderSettingsOverlay) : '') +
  '</div>';
}
function renderSettingsOverlay(){
  return '<div class="settings-overlay" onclick="if(event.target===this) App.toggleSettings()">' +
    '<div class="settings-modal">' +
      '<div class="settings-modal-header"><h2>' + t('settingsTitle') + '</h2><button class="icon-btn" title="' + t('closeBtn') + '" onclick="App.toggleSettings()" style="font-size:1.1rem;">✕</button></div>' +
      safeRun(renderAnpassungPanel) +
      safeRun(renderErinnerungPanel) +
      safeRun(renderDataPanel) +
    '</div>' +
  '</div>';
}
function renderDataPanel(){
  return '<section class="panel data-panel">' +
    '<h2>' + t('dataTitle') + '</h2>' +
    '<div class="chip-row">' +
      '<button class="btn ghost" onclick="App.exportData()">' + t('exportBtn') + '</button>' +
      '<label class="btn ghost file-label">' + t('importBtn') + '<input type="file" accept="application/json" onchange="App.importData(this.files[0])" hidden></label>' +
    '</div>' +
  '</section>';
}

// ---------- Lebenszyklus ----------
function render(){ document.getElementById('app').innerHTML = buildAppHtml(); }
function persist(){ loewenStorage.set(STORAGE_KEY, JSON.stringify(state)); }
function saveAndRender(){ render(); persist(); }

function init(){
  loewenStorage.get(STORAGE_KEY).then(function(raw){
    var loaded = null;
    try{ loaded = raw ? JSON.parse(raw) : null; }catch(e){ loaded = null; }
    state = migrateState(loaded || {});
    ui = {
      selectedLabelId: (state.labels.filter(function(l){ return l.id!=='unlabeled'; })[0] || state.labels[0]).id,
      pendingLabelColor: LABEL_COLORS[2],
      historyExpanded: false,
      settingsOpen: false,
      labelsExpanded: false,
      showEventForm: false
    };
    checkFeedingStatus();
    render();
    persist();
    rescheduleDailyReminder();
    rescheduleNeglectNotification();
    state.tasks.forEach(function(t){ if (!t.done) scheduleTaskNotification(t); });
    state.events.forEach(function(e){ scheduleEventNotification(e); });
    document.addEventListener('mousemove', eyeParallax);
    startWander();
    setInterval(function(){
      if (checkFeedingStatus()) saveAndRender();
    }, 60000);
  });
}

window.App = {
  addTaskFromForm: addTaskFromForm, completeTask: completeTask, deleteTask: deleteTask,
  onLabelSelectChange: onLabelSelectChange, onDueSelectChange: onDueSelectChange,
  pickLabelColor: pickLabelColor, saveNewLabel: saveNewLabel, pickEventColor: pickEventColor,
  renameLabel: renameLabel, deleteLabel: deleteLabel,
  setFilter: setFilter, toggleCluster: toggleCluster, toggleHistory: toggleHistory, toggleSettings: toggleSettings, toggleLabelsPanel: toggleLabelsPanel, saveNewLabelStandalone: saveNewLabelStandalone,
  selectCalendarDate: selectCalendarDate, shiftMonth: shiftMonth,
  toggleEventForm: toggleEventForm, addEvent: addEvent, deleteEvent: deleteEvent, toggleEventReminder: toggleEventReminder,
  setPalette: setPalette, setPodest: setPodest, setManeColor: setManeColor, setExtraReaction: setExtraReaction, setTailStyle: setTailStyle, setTreePosition: setTreePosition, setLanguage: setLanguage,
  toggleReminderEnabled: toggleReminderEnabled, setReminderTime: setReminderTime, setCreatureName: setCreatureName,
  toggleWarnings: toggleWarnings, toggleMotivational: toggleMotivational,
  requestNotifPermission: requestNotifPermission, dismissReminder: dismissReminder,
  exportData: exportData, importData: importData, setPhoto: setPhoto
};

document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
